name: iOS app

# Builds the Quizora iOS app (ios/) on a Mac runner.
#  - Every run builds it for the iPhone simulator, opens it there and checks the site loads,
#    so a broken build shows up even before you have an Apple Developer account.
#  - Once the App Store Connect secrets are set (see ios/README.md), pushes to main also
#    sign the app and upload it to TestFlight, where students install it.
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml', '.github/scripts/ios-smoke-test.sh']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml', '.github/scripts/ios-smoke-test.sh']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Quizora.xcodeproj -scheme Quizora -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 80

      - name: Open it in the simulator
        run: bash .github/scripts/ios-smoke-test.sh ios/build/Build/Products/Debug-iphonesimulator/Quizora.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshot
          path: ios-smoke.png
          if-no-files-found: ignore

  # An unsigned IPA for trying the app on your own iPhone without a paid Apple account:
  # sign it with your Apple ID using Sideloadly or AltStore (see ios/README.md). Apps signed
  # with a free Apple ID run for 7 days. Published on the "ios-unsigned-latest" release.
  unsigned-ipa:
    needs: simulator
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build the unsigned IPA
        working-directory: ios
        run: |
          set -eo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          xcodebuild -project Quizora.xcodeproj -scheme Quizora -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
          mkdir -p Payload ../dist
          cp -R build/Build/Products/Release-iphoneos/Quizora.app Payload/
          zip -qry "../dist/Quizora-1.0.${{ github.run_number }}-unsigned.ipa" Payload
          ls -l ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: quizora-ios-unsigned-1.0.${{ github.run_number }}
          path: dist/*.ipa
          if-no-files-found: error

      - name: Publish on the ios-unsigned-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-unsigned-latest --yes --cleanup-tag || true
          gh release create ios-unsigned-latest dist/*.ipa --prerelease \
            --title "Quizora iOS app 1.0.${{ github.run_number }} (unsigned, for testing)" \
            --notes "Unsigned build for testing on your own iPhone. Sign and install it with Sideloadly or AltStore using your Apple ID; with a free Apple ID it runs for 7 days. Students should use TestFlight instead (see ios/README.md). Built from ${{ github.sha }}." \
            --target "${{ github.sha }}"

  testflight:
    needs: simulator
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.quizora.app' }}
      ASSESSMENT_MODE: ${{ vars.IOS_ASSESSMENT_MODE }}
    steps:
      - name: Check the App Store Connect secrets
        id: secrets
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY" ] && [ -n "$TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=TestFlight upload skipped::Add the App Store Connect secrets (see ios/README.md) to upload builds to TestFlight."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Archive and upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        working-directory: ios
        run: |
          set -eo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          EXTRA=()
          if [ "$ASSESSMENT_MODE" = "true" ]; then
            EXTRA=(CODE_SIGN_ENTITLEMENTS=Quizora/Quizora-Assessment.entitlements QUIZORA_ASSESSMENT_MODE=YES)
          fi

          xcodebuild -project Quizora.xcodeproj -scheme Quizora -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Quizora.xcarchive" \
            "${AUTH[@]}" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${EXTRA[@]}" | tail -n 80

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Quizora.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -n 40

          rm -f "$KEY_PATH"
          echo "::notice title=TestFlight::Build 1.0 (${{ github.run_number }}) uploaded. It appears in App Store Connect → TestFlight after Apple finishes processing (usually 10–30 minutes)."
