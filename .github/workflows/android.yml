name: Android app

# Builds the Quizora Android app (android/). Every run uploads the APK as a workflow
# artifact; pushes to main also publish it on the "android-latest" GitHub release, a
# direct download link you can share with students.
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Gradle wrapper is genuine
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign the release APK with your own key (see android/README.md).
      # Without these secrets only the debug APK is built.
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.QUIZORA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quizora.jks"
            echo "QUIZORA_KEYSTORE_FILE=$RUNNER_TEMP/quizora.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          QUIZORA_KEYSTORE_PASSWORD: ${{ secrets.QUIZORA_KEYSTORE_PASSWORD }}
          QUIZORA_KEY_ALIAS: ${{ secrets.QUIZORA_KEY_ALIAS }}
          QUIZORA_KEY_PASSWORD: ${{ secrets.QUIZORA_KEY_PASSWORD }}
          QUIZORA_VERSION_CODE: ${{ github.run_number }}
          QUIZORA_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          ./gradlew --no-daemon assembleDebug
          if [ "$SIGNED" = "true" ]; then ./gradlew --no-daemon assembleRelease; fi
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/quizora-1.0.${{ github.run_number }}-debug.apk"
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "../dist/quizora-1.0.${{ github.run_number }}.apk"
          fi
          ls -l ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: quizora-android-1.0.${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish on the android-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/*.apk \
            --title "Quizora Android app 1.0.${{ github.run_number }}" \
            --notes "Install on Android 8.0 or newer: download the APK on the phone and open it (allow installing from this source when asked). Built from ${{ github.sha }}." \
            --target "${{ github.sha }}"

  # Installs the APK on an Android emulator, opens it and checks the site loads and the
  # window is protected from screen capture (FLAG_SECURE). Results appear as annotations on the run.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quizora-android-1.0.${{ github.run_number }}
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/android-smoke-test.sh
