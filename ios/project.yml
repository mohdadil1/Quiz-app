# XcodeGen spec for the Quizora iOS app. GitHub Actions turns this into Quizora.xcodeproj
# (`xcodegen generate`), so the Xcode project itself is not committed.
name: Quizora
options:
  bundleIdPrefix: com.quizora
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # The Quizora website the app opens (override: xcodebuild ... QUIZORA_URL=https://...)
    QUIZORA_URL: https://quiz-app-sigma-lemon-97.vercel.app
    # YES once Apple has granted the assessment-mode entitlement (see README.md)
    QUIZORA_ASSESSMENT_MODE: "NO"
    # Override with a repository variable IOS_BUNDLE_ID if this one is taken on your account
    PRODUCT_BUNDLE_IDENTIFIER: com.quizora.app

targets:
  Quizora:
    type: application
    platform: iOS
    sources:
      - path: Quizora
        excludes:
          - "*.entitlements"
    info:
      path: Quizora/Info.plist
      properties:
        CFBundleDisplayName: Quizora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        QuizoraSiteURL: $(QUIZORA_URL)
        QuizoraAssessmentMode: $(QUIZORA_ASSESSMENT_MODE)
        # Keep the website out of screenshots and recordings (see CaptureShield.swift)
        QuizoraBlockScreenCapture: true
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Webcam proctoring
        NSCameraUsageDescription: Quizora uses the camera to check that you stay in front of the screen during webcam-proctored tests.
        # Teachers uploading student lists or question images
        NSPhotoLibraryUsageDescription: Quizora opens your photos only when you choose a file to upload.
        # Only standard HTTPS: no export-compliance paperwork needed for TestFlight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
